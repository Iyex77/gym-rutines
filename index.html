      var prevTxt = cardioSummary({ duration: e.prevDuration, distance: e.prevDistance, level: e.prevLevel });
      h += '<div class="ex' + (confC ? ' done' : '') + '" id="ex' + i + '">' +
        '<div class="ex-h" onclick="toggleEx(' + i + ')">' + exThumb(e, true) +
        '<div class="ex-b"><div class="ex-n">' + esc(liveExName(e, s.rid)) + (confC ? '<span class="tick">✓</span>' : '') + '</div>' +
        '<div class="ex-m">' + esc(e.target || 'Cardio') +
        (prevTxt !== '—' ? '<br><span style="color:var(--acc)">Anterior: ' + prevTxt + '</span>' : '') +
        '</div></div>' +
        '<button class="swap-btn" onclick="event.stopPropagation();swapExercise(' + i + ')">' + iconSVG('swap', 14) + '<span>Cambiar</span></button>' +
        '<div class="ex-chev">▾</div></div>' +
        '<div class="ex-body">' +
        '<div class="row2">' +
        '<div class="fld"><label>Duración min</label><input class="inp" type="number" inputmode="numeric" min="0" placeholder="' + (e.prevDuration || '—') + '" value="' + esc(e.duration) + '" onfocus="this.select()" oninput="setCardioVal(' + i + ',\'duration\',this.value)"></div>' +
        '<div class="fld"><label>Distancia km</label><input class="inp" type="number" inputmode="decimal" step="0.1" min="0" placeholder="' + (e.prevDistance || '—') + '" value="' + esc(e.distance) + '" onfocus="this.select()" oninput="setCardioVal(' + i + ',\'distance\',this.value)"></div>' +
        '<div class="fld"><label>Nivel</label><input class="inp" type="number" inputmode="numeric" min="0" placeholder="' + (e.prevLevel || '—') + '" value="' + esc(e.level) + '" onfocus="this.select()" oninput="setCardioVal(' + i + ',\'level\',this.value)"></div>' +
        '</div>' +
        '<textarea class="ta" placeholder="Notas del ejercicio…" oninput="UI.sess.entries[' + i + '].note=this.value">' + esc(e.note || '') + '</textarea>' +
        '</div></div>';
      return;
    }
    var prev = lastFor(e.name, s.id, s.date, e.exid);
    var hasVals = (e.sets || []).some(function (st) { return st.kg || st.reps; });
    var pend = e.pre && !e.touched;                 /* precargado, sin confirmar */
    var conf = hasVals && !pend;                    /* confirmado de verdad */
    h += '<div class="ex' + (conf ? ' done' : '') + (pend ? ' pend' : '') + '" id="ex' + i + '">' +
      '<div class="ex-h" onclick="toggleEx(' + i + ')">' + exThumb(e, true) +
      '<div class="ex-b"><div class="ex-n">' + esc(liveExName(e, s.rid)) +
      (conf ? '<span class="tick">✓</span>' : '') +
      (pend ? '<span class="pill-pre">sin confirmar</span>' : '') + '</div>' +
      '<div class="ex-m">' + esc(e.target || '') +
      (prev ? '<br><span style="color:var(--acc)">' + (pend ? 'Precargado del ' + fdate(prev.s.date) : 'Anterior: ' + prev.e.sets.filter(function (x) { return x.kg || x.reps; }).map(function (x) { return (x.kg || '—') + '×' + (x.reps || '—'); }).join('  ')) + '</span>' : '') +
      '</div></div>' +
      '<button class="swap-btn" onclick="event.stopPropagation();swapExercise(' + i + ')">' + iconSVG('swap', 14) + '<span>Cambiar</span></button>' +
      '<div class="ex-chev">▾</div></div>' +
      '<div class="ex-body">' +
      '<div class="setgrid"><div></div><div class="lbl">Peso kg</div><div class="lbl">Reps</div><div></div></div>';

    e.sets.forEach(function (st, j) {
      var ph = prev && prev.e.sets[j] ? (prev.e.sets[j].kg || '') : '';
      h += '<div class="setgrid setrow">' +
        '<div class="sn">' + (j + 1) + '</div>' +
        '<input class="inp' + (pend ? ' pre' : '') + '" type="number" inputmode="decimal" step="0.5" min="0" placeholder="' + (ph || '—') + '" value="' + esc(st.kg) + '" onfocus="this.select()" oninput="setVal(' + i + ',' + j + ',\'kg\',this.value)">' +
        '<input class="inp' + (pend ? ' pre' : '') + '" type="number" inputmode="numeric" min="0" placeholder="' + (prev && prev.e.sets[j] ? (prev.e.sets[j].reps || '—') : '—') + '" value="' + esc(st.reps) + '" onfocus="this.select()" oninput="setVal(' + i + ',' + j + ',\'reps\',this.value)">' +
        (e.sets.length > 1 ? '<button class="mini" onclick="delSet(' + i + ',' + j + ')">−</button>' : '<div></div>') +
        '</div>';
    });

    h += (pend
      ? '<button class="btn btn-ok sm" style="margin-top:8px" onclick="confirmEx(' + i + ')">✓ Mismo peso que la última vez</button><div style="height:7px"></div>'
      : '') +
      '<button class="btn btn-n sm" style="margin-top:' + (pend ? '0' : '8px') + '" onclick="addSet(' + i + ')">＋ Añadir serie</button>' +
      '<textarea class="ta" placeholder="Notas del ejercicio…" oninput="UI.sess.entries[' + i + '].note=this.value">' + esc(e.note || '') + '</textarea>' +
      '<div class="hint">Descanso sugerido: ' + (e.rest || 60) + ' s</div>' +
      '</div></div>';
  });

  h += '<div style="height:6px"></div>' +
    '<button class="btn btn-p" onclick="saveSession()">' + (UI.isNew ? 'Guardar sesión' : 'Guardar cambios') + '</button>';
  if (!UI.isNew) h += '<div style="height:9px"></div><button class="btn btn-d sm" onclick="deleteSession(\'' + s.id + '\')">Eliminar esta sesión</button>';
  h += '<div style="height:9px"></div><button class="btn btn-n sm" onclick="leaveSession()">Cancelar</button></div>';
  return h;
}

function toggleEx(i) { document.getElementById('ex' + i).classList.toggle('open'); }
function setVal(i, j, k, v) {
  var e = UI.sess.entries[i];
  e.sets[j][k] = v; e.touched = true; UI.dirty = true;
  var card = document.getElementById('ex' + i);
  if (card) {
    card.classList.remove('pend');
    card.classList.toggle('done', e.sets.some(function (st) { return st.kg || st.reps; }));
    var p = card.querySelector('.pill-pre'); if (p) p.remove();
    card.querySelectorAll('.inp.pre').forEach(function (x) { x.classList.remove('pre'); });
  }
}
function setCardioVal(i, field, v) {
  var e = UI.sess.entries[i];
  e[field] = v; UI.dirty = true;
  var card = document.getElementById('ex' + i);
  if (card) card.classList.toggle('done', entryFilled(e));
}
/* confirmar un ejercicio tal cual venía precargado */
function confirmEx(i) {
  UI.sess.entries[i].touched = true; UI.dirty = true;
  reRenderKeepOpen();
}
/* Copia los pesos de la última sesión de esta rutina. Empareja por id, luego
   por nombre y, si no, por posición: así funciona aunque hayas cambiado los
   ejercicios de la rutina. */
function copiarAnterior() {
  var s = UI.sess;
  var ant = lastOfRoutine(s.rid, s.id);
  if (!ant) { toast('No hay ninguna sesión anterior de esta rutina', 'bad'); return; }
  var n = 0;
  s.entries.forEach(function (e, i) {
    if (e.type === 'cardio') return;   /* ya lleva el anterior como referencia (placeholder), no hay nada que "copiar" */
    var ents = ant.entries || [], src = null;
    var lleno = function (x) { return x && (x.sets || []).some(function (st) { return st.kg || st.reps; }); };
    if (e.exid) src = ents.find(function (x) { return x.exid === e.exid && lleno(x); });
    if (!src) src = ents.find(function (x) { return x.name === e.name && lleno(x); });
    /* sin respaldo por posición: si el orden cambió, más vale no copiar nada
       para ese ejercicio que copiar el peso de otro por error */
    if (!src) return;
    var llenas = (src.sets || []).filter(function (x) { return x.kg || x.reps; });
    if (!llenas.length) return;
    var total = Math.max(e.sets.length, llenas.length);
    var nuevas = [];
    for (var k = 0; k < total; k++) {
      var p = llenas[k] || llenas[llenas.length - 1];
      nuevas.push({ kg: p.kg, reps: p.reps });
    }
    e.sets = nuevas; e.pre = true; e.touched = false; n++;
  });
  if (!n) {
    /* no hay ni un solo emparejamiento: casi siempre es porque hay ejercicios
       sin historial vinculado. Se ofrece la solución, no solo el error. */
    if (exercisesNeedingLink(s.rid).length) { abrirVinculador(s.rid); return; }
    toast('No había nada que copiar', 'bad');
    return;
  }
  UI.dirty = true;
  reRenderKeepOpen(); scrollTop();
  toast('Copiados ' + n + ' ejercicios · revisa y confirma', 'ok');
}

/* confirmar toda la sesión de golpe */
function confirmAll() {
  UI.sess.entries.forEach(function (e) { if (e.pre) e.touched = true; });
  UI.dirty = true; reRenderKeepOpen();
  toast('Sesión confirmada con los pesos anteriores', 'ok');
}
function addSet(i) { UI.sess.entries[i].sets.push({ kg: '', reps: '' }); reRenderKeepOpen(); }
function delSet(i, j) { UI.sess.entries[i].sets.splice(j, 1); reRenderKeepOpen(); }
function reRenderKeepOpen() {
  var open = [].slice.call(document.querySelectorAll('.ex.open')).map(function (el) { return el.id; });
  var y = scrollPos(); render();
  open.forEach(function (id) { var el = document.getElementById(id); if (el) el.classList.add('open'); });
  scrollSet(y);
}
function leaveSession() {
  if (UI.dirty && !confirm('Hay cambios sin guardar. ¿Salir igualmente?')) return;
  UI.sess = null; UI.dirty = false; UI.tab = UI.isNew ? 'train' : 'hist'; render(); scrollTop();
}
function saveSession() {
  var s = UI.sess;
  if (!s.date) { toast('Falta la fecha', 'bad'); return; }
  if (!sessionFilled(s)) { toast('Apunta al menos un peso o repetición', 'bad'); return; }

  /* si algo quedó precargado y sin confirmar, no lo damos por hecho a la ligera:
     guardarlo sin más registraría un ejercicio que quizá no hiciste */
  var pend = s.entries.filter(function (e) { return e.type !== 'cardio' && e.pre && !e.touched; });
  if (pend.length && UI.isNew) {
    openSheet('<div class="grab"></div><div class="sheet-h">' + pend.length + ' sin confirmar</div>' +
      '<div class="sheet-s">Llevan los pesos de la última vez, pero no los has tocado</div>' +
      '<div style="font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:15px">' +
      pend.map(function (e) { return '· ' + esc(e.name); }).join('<br>') + '</div>' +
      '<button class="btn btn-ok" onclick="doSave(true)">Los hice igual — guardar con esos pesos</button>' +
      '<div style="height:9px"></div>' +
      '<button class="btn btn-n sm" onclick="doSave(false)">No los hice — dejarlos fuera</button>' +
      '<div style="height:9px"></div>' +
      '<button class="btn btn-n sm" onclick="closeSheet()">Volver a la sesión</button>');
    return;
  }
  doSave(true);
}

function doSave(keepPend) {
  var s = UI.sess;
  closeSheet();
  if (!keepPend) {
    s.entries.forEach(function (e) {
      if (e.pre && !e.touched) e.sets = e.sets.map(function () { return { kg: '', reps: '' }; });
    });
    if (!sessionFilled(s)) { toast('No queda nada que guardar', 'bad'); return; }
  }
  s.entries.forEach(function (e) { delete e.pre; delete e.touched; delete e.prevDate; });
  s.mt = now();
  var i = DB.sessions.findIndex(function (x) { return x.id === s.id; });
  if (i >= 0) DB.sessions[i] = s; else DB.sessions.push(s);
  commit();
  UI.dirty = false; var wasNew = UI.isNew; UI.sess = null;
  UI.tab = 'hist'; render(); scrollTop();
  toast(wasNew ? '✓ Sesión guardada · ' + volSession(s).toLocaleString('es-ES') + ' kg' : '✓ Cambios guardados', 'ok');
}
function deleteSession(sid) {
  if (!confirm('¿Eliminar esta sesión del historial?')) return;
  var s = DB.sessions.find(function (x) { return x.id === sid; });
  if (s) { s.del = true; s.mt = now(); }
  commit(); UI.sess = null; UI.dirty = false; UI.tab = 'hist'; render(); toast('Sesión eliminada');
}

/* ============================================================
   Cambiar un ejercicio SOLO para la sesión de hoy — la rutina
   no se toca, es un sustituto puntual (máquina ocupada, etc.)
   ============================================================ */
function swapExercise(i) {
  UI.swapIdx = i;
  var actual = UI.sess.entries[i];
  var actualEx = allExercisesFlat().find(function (o) { return o.id === actual.exid; });
  var muscle = actualEx && actualEx.muscle;
  var actualMuscles = actualEx ? [actualEx.muscle].concat(actualEx.muscles2 || []).filter(Boolean) : [];
  var otros = allExercisesFlat().filter(function (o) { return o.id !== actual.exid; });
  var h = '<div class="grab"></div><div class="sheet-h">Cambiar ejercicio de hoy</div>' +
    '<div class="sheet-s">Sustituye "' + esc(liveExName(actual, UI.sess.rid)) + '" solo en esta sesión. La rutina no cambia.</div>';

  var pintaLista = function (lista) {
    lista.forEach(function (o) {
      h += '<button class="ex" style="width:100%;text-align:left;cursor:pointer;padding:0;border:1px solid var(--line)" onclick="doSwap(\'' + o.id + '\')">' +
        '<div class="ex-h">' + exThumb(o, false) +
        '<div class="ex-b"><div class="ex-n">' + esc(o.name) + '</div>' +
        '<div class="ex-m">De ' + esc(o.routineName) + '</div></div></div></button>';
    });
  };
  if (actualMuscles.length) {
    var comparte = function (o) {
      var om = [o.muscle].concat(o.muscles2 || []).filter(Boolean);
      return om.some(function (m) { return actualMuscles.indexOf(m) >= 0; });
    };
    var mismo = otros.filter(comparte);
    var resto = otros.filter(function (o) { return !comparte(o); });
    if (mismo.length) { h += '<div class="sect" style="margin-top:4px">Mismo grupo muscular (' + muscle + ')</div>'; pintaLista(mismo); }
    if (resto.length) { h += '<div class="sect">Otros ejercicios</div>'; pintaLista(resto); }
  } else if (otros.length) {
    h += '<div class="sect" style="margin-top:4px">De tus rutinas</div>';
    pintaLista(otros);
  }

  h += '<div class="sect">Nuevo, solo por hoy</div>' +
    '<div class="fld"><label>Nombre</label><input id="swapName" placeholder="Ej. Press inclinado"></div>' +
    '<div class="fld"><label>Foto (opcional)</label><div class="picker scroll" id="swapPick">' + swapPickerHTML() + '</div></div>' +
    '<button class="btn btn-g" onclick="doSwapAdhoc()">Usar este</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>';
  openSheet(h);
}
function swapPickerHTML() {
  var sel = UI.swapImg || '';
  var h = '';
  Object.keys(IMGLIB).forEach(function (k) {
    h += '<button class="pk' + (sel === k ? ' on' : '') + '" onclick="UI.swapImg=\'' + k + '\';document.getElementById(\'swapPick\').innerHTML=swapPickerHTML()"><img src="' + imgSrc(k) + '" alt=""></button>';
  });
  return h;
}

/* sustituir por un ejercicio ya existente: reconstruye la entrada igual que
   al empezar sesión, con su propia precarga si tiene historial */
function doSwap(exId) {
  var src = allExercisesFlat().find(function (o) { return o.id === exId; });
  if (!src) return;
  var prev = lastFor(src.name, UI.sess.id, UI.sess.date, src.id);
  var prevSets = prev ? prev.e.sets.filter(function (x) { return x.kg || x.reps; }) : [];
  var n = Math.max(1, src.sets || 3, prevSets.length);
  var sets = [];
  for (var k = 0; k < n; k++) {
    var p = prevSets[k] || prevSets[prevSets.length - 1];
    sets.push(p ? { kg: p.kg, reps: p.reps } : { kg: '', reps: '' });
  }
  UI.sess.entries[UI.swapIdx] = {
    name: src.name, exid: src.id, img: src.img, icon: src.icon, rest: src.rest, note: '',
    sets: sets, pre: prevSets.length > 0, touched: false,
    prevDate: prev ? prev.s.date : '',
    target: (src.sets || 3) + '×' + (src.reps || 12) + (src.note ? ' · ' + src.note : '')
  };
  UI.dirty = true;
  closeSheet(); reRenderKeepOpen();
  toast('Ejercicio cambiado para hoy', 'ok');
}
/* ad-hoc: no está en ninguna rutina, sin historial — se guarda tal cual */
function doSwapAdhoc() {
  var name = (document.getElementById('swapName').value || '').trim();
  if (!name) { toast('Ponle un nombre', 'bad'); return; }
  UI.sess.entries[UI.swapIdx] = {
    name: name, exid: '', img: UI.swapImg || '', icon: 'dumbbell', rest: 60, note: '',
    sets: [{ kg: '', reps: '' }, { kg: '', reps: '' }, { kg: '', reps: '' }],
    pre: false, touched: false, prevDate: '', target: '3×12'
  };
  UI.swapImg = '';
  UI.dirty = true;
  closeSheet(); reRenderKeepOpen();
  toast('Añadido solo para hoy', 'ok');
}

</script>
<script>
/* ===== views2.js ===== */
/* ============================================================
   Editor de rutinas y ejercicios
   ============================================================ */
function pickRoutineToEdit() {
  var rs = liveRoutines();
  var h = '<div class="grab"></div><div class="sheet-h">Editar rutina</div><div class="sheet-s">Elige cuál quieres modificar</div>';
  rs.forEach(function (r) {
    h += '<button class="rt" onclick="closeSheet();editRoutine(\'' + r.id + '\')">' +
      '<div class="rt-ic" style="color:' + colorHex(r.color) + ';background:' + colorHex(r.color) + '1f;border-color:' + colorHex(r.color) + '4d">' + iconSVG(r.icon || 'dumbbell', 22) + '</div><div class="rt-b"><div class="rt-n">' + esc(r.name) + '</div>' +
      '<div class="rt-m">' + (r.ex || []).length + ' ejercicios</div></div><div class="rt-go">›</div></button>';
  });
  openSheet(h);
}

function editRoutine(rid) {
  var r = rid ? liveRoutines().find(function (x) { return x.id === rid; }) : null;
  UI.editRoutine = r ? JSON.parse(JSON.stringify(r)) : { id: uid('r'), name: '', icon: 'dumbbell', color: PALETTE[liveRoutines().length % PALETTE.length].k, ex: [], mt: now() };
  UI.editNew = !r;
  UI.tab = 'redit'; render(); scrollTop();
}

function viewREdit() {
  var r = UI.editRoutine; if (!r) { UI.tab = 'train'; return viewTrain(); }
  var h = '<div class="topbar"><div><h1>' + (UI.editNew ? 'Nueva rutina' : 'Editar rutina') + '</h1>' +
    '<div class="sub">Los cambios no afectan a sesiones ya guardadas</div></div>' +
    '<button class="icon-btn" onclick="UI.editRoutine=null;UI.tab=\'train\';render()">✕</button></div><div class="wrap">';

  h += '<div class="fld"><label>Nombre de la rutina</label>' +
    '<input id="rname" placeholder="Ej. Tren inferior" value="' + esc(r.name) + '" oninput="UI.editRoutine.name=this.value"></div>';

  h += '<div class="fld"><label>Color de la rutina</label><div class="pal">';
  PALETTE.forEach(function (c) {
    h += '<button class="sw' + (r.color === c.k ? ' on' : '') + '" style="background:' + c.hex +
      '" title="' + c.name + '" onclick="UI.editRoutine.color=\'' + c.k + '\';render()"></button>';
  });
  h += '</div><div class="hint" style="text-align:left;padding-top:7px">Se usa en el calendario de días entrenados para distinguir esta rutina de las demás.</div></div>';

  h += '<div class="fld"><label>Emoji del teclado</label>' +
    '<div style="display:flex;align-items:center;gap:12px">' +
    '<div class="ex-emo" id="rIconPrev" style="width:52px;height:52px;border-radius:13px;color:' + colorHex(r.color) + '">' +
    iconSVG(r.icon || 'dumbbell', 26) + '</div>' +
    '<input class="emoji-in" id="rEmoji" style="flex:1;text-align:left;font-size:20px" maxlength="8" ' +
    'placeholder="Toca y usa 🙂" value="' + (isEmoji(r.icon) ? esc(r.icon) : '') + '" oninput="onRoutineEmoji(this.value)"></div></div>';

  h += '<div class="fld"><label>O un icono dibujado</label><div class="picker scroll">';
  ICONKEYS.forEach(function (k) {
    h += '<button class="pk' + (r.icon === k ? ' on' : '') + '"' +
      (r.icon === k ? ' style="color:' + colorHex(r.color) + ';border-color:' + colorHex(r.color) + ';background:' + colorHex(r.color) + '1f"' : '') +
      ' onclick="UI.editRoutine.icon=\'' + k + '\';render()">' + iconSVG(k, 25) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="sect">Ejercicios (' + r.ex.length + ')</div>';
  h += muscleCountsHTML(r);
  if (!r.ex.length) h += '<div class="empty" style="padding:26px"><span class="big">🏋️</span>Añade el primer ejercicio</div>';

  r.ex.forEach(function (e, i) {
    h += '<div class="ex"><div class="ex-h">' + exThumb(e, false) +
      '<div class="ex-b"><div class="ex-n">' + esc(e.name) + '</div>' +
      '<div class="ex-m">' + (e.type === 'cardio' ? 'Cardio' : e.sets + '×' + e.reps + ' · ' + e.rest + 's') + (e.note ? ' · ' + esc(e.note) : '') + '</div></div>' +
      '<button class="mini" onclick="moveEx(' + i + ',-1)"' + (i === 0 ? ' disabled style="opacity:.3"' : '') + '>↑</button>' +
      '<button class="mini" onclick="moveEx(' + i + ',1)"' + (i === r.ex.length - 1 ? ' disabled style="opacity:.3"' : '') + '>↓</button>' +
      '</div><div class="ex-body" style="display:block;padding-top:10px">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
      '<button class="btn btn-n sm" onclick="editEx(' + i + ')">✏️ Editar</button>' +
      '<button class="btn btn-n sm" onclick="pickExistingFor(' + i + ')">🔁 Cambiar</button>' +
      '<button class="btn btn-d sm" onclick="rmEx(' + i + ')">Quitar</button></div></div></div>';
  });

  h += '<div style="height:6px"></div><button class="btn btn-g sm" onclick="pickExistingFor(-1)">＋ Añadir ejercicio</button>';

  /* ofrecer vincular si algún ejercicio de esta rutina no tiene historial propio ni compartido */
  if (!UI.editNew && exercisesNeedingLink(r.id).length) {
    h += '<div style="height:8px"></div>' +
      '<button class="btn btn-n sm" onclick="abrirVinculador(\'' + r.id + '\')">↔ Vincular con historial de antes o de otra rutina</button>';
  }

  h += 
    '<div style="height:16px"></div><button class="btn btn-p" onclick="saveRoutine()">Guardar rutina</button>';
  if (!UI.editNew) h += '<div style="height:9px"></div><button class="btn btn-d sm" onclick="delRoutine()">Eliminar rutina</button>';
  h += '</div>';
  return h;
}

function moveEx(i, d) {
  var a = UI.editRoutine.ex, j = i + d;
  if (j < 0 || j >= a.length) return;
  var t = a[i]; a[i] = a[j]; a[j] = t; render();
}
function rmEx(i) { UI.editRoutine.ex.splice(i, 1); render(); }

function editEx(i) {
  var isNew = i < 0;
  UI.exIdx = i;
  UI.exGlobal = false;
  UI.exDraft = isNew
    ? { id: uid('e'), name: '', img: '', icon: 'dumbbell', sets: 3, reps: 12, rest: 60, note: '', muscle: '', muscles2: [], type: 'fuerza' }
    : JSON.parse(JSON.stringify(UI.editRoutine.ex[i]));
  if (!UI.exDraft.muscles2) UI.exDraft.muscles2 = [];
  UI.exImgTab = defaultImgTab(UI.exDraft);
  UI.exIsNew = isNew;
  openSheet(exSheetHTML(isNew));
}
/* Elegir un ejercicio ya creado en vez de escribirlo de cero — para añadir uno
   nuevo a la rutina (i=-1) o para cambiar uno que ya está (i>=0). Reusa la
   misma vía de identidad compartida que el tab "Reusar" del formulario. */
function pickExistingFor(i) {
  UI.pickForIdx = i;
  var rid = UI.editRoutine && UI.editRoutine.id;
  var otros = allExercisesFlat(rid);
  var h = '<div class="grab"></div><div class="sheet-h">' + (i < 0 ? 'Añadir ejercicio' : 'Cambiar ejercicio') + '</div>' +
    '<div class="sheet-s">Elige uno ya creado, o escribe uno nuevo</div>';
  if (otros.length) {
    var porRutina = {};
    otros.forEach(function (o) { (porRutina[o.routineName] = porRutina[o.routineName] || []).push(o); });
    Object.keys(porRutina).forEach(function (rn) {
      h += '<div class="sect">' + esc(rn) + '</div>';
      porRutina[rn].forEach(function (o) {
        h += '<button class="ex" style="width:100%;text-align:left;cursor:pointer;padding:0;border:1px solid var(--line)" onclick="useExistingEx(\'' + o.id + '\')">' +
          '<div class="ex-h">' + exThumb(o, false) +
          '<div class="ex-b"><div class="ex-n">' + esc(o.name) + '</div>' +
          (o.muscle ? '<div class="ex-m">' + esc(o.muscle) + '</div>' : '') + '</div></div></button>';
      });
    });
  } else {
    h += '<div class="hint" style="text-align:left;padding:6px 0">Aún no tienes otros ejercicios creados.</div>';
  }
  h += '<div style="height:6px"></div><button class="btn btn-g sm" onclick="editEx(UI.pickForIdx)">✎ Escribir uno nuevo</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>';
  openSheet(h);
}
function useExistingEx(exId) {
  editEx(UI.pickForIdx);
  onReuseEx(exId);
  UI.exImgTab = defaultImgTab(UI.exDraft);
  openSheet(exSheetHTML(UI.exIsNew));
}
/* cuántos ejercicios de la rutina tocan cada músculo (principal + secundarios)
   — para detectar de un vistazo si está descompensada */
function muscleCounts(r) {
  var c = {};
  (r.ex || []).forEach(function (e) {
    [e.muscle].concat(e.muscles2 || []).filter(Boolean).forEach(function (m) { c[m] = (c[m] || 0) + 1; });
  });
  return c;
}
function muscleCountsHTML(r) {
  var c = muscleCounts(r);
  var keys = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; });
  if (!keys.length) return '';
  return '<div class="chips" style="margin-bottom:10px">' +
    keys.map(function (m) { return '<span class="chip" style="cursor:default">' + esc(m) + ' ×' + c[m] + '</span>'; }).join('') + '</div>';
}
function defaultImgTab(e) {
  if (e.reuseId) return 'reusar';
  if (e.img && e.img.slice(0, 2) === 'p:') return 'foto';
  if (e.img && IMGLIB[e.img]) return 'catalogo';
  return 'icono';
}

/* Editar/crear un ejercicio desde la pestaña Ejercicios, sin rutina de por
   medio. Reusa el mismo formulario (exSheetHTML/commitEx); solo cambia dónde
   se guarda al confirmar. */
function editExGlobal(exId) {
  UI.exIdx = -1;
  UI.exGlobal = true;
  var src = exId ? allExercisesFlat().find(function (x) { return x.id === exId; }) : null;
  UI.exDraft = src
    ? { id: src.id, name: src.name, img: src.img, icon: src.icon, sets: src.sets, reps: src.reps, rest: src.rest, note: src.note, muscle: src.muscle || '', muscles2: (src.muscles2 || []).slice(), type: src.type || 'fuerza' }
    : { id: uid('e'), name: '', img: '', icon: 'dumbbell', sets: 3, reps: 12, rest: 60, note: '', muscle: '', muscles2: [], type: 'fuerza' };
  UI.exImgTab = defaultImgTab(UI.exDraft);
  UI.exIsNew = !src;
  openSheet(exSheetHTML(!src));
}
function setExType(t) {
  syncDraftFields();
  UI.exDraft.type = (t === 'cardio') ? 'cardio' : 'fuerza';
  openSheet(exSheetHTML(UI.exIsNew));
}

function exSheetHTML(isNew) {
  var e = UI.exDraft;
  return '<div class="grab"></div><div class="sheet-h">' + (isNew ? 'Nuevo ejercicio' : 'Editar ejercicio') + '</div>' +
    '<div class="sheet-s">Nombre, músculo e imagen — series/reps/descanso abajo</div>' +
    '<div class="fld"><label>Nombre</label><input id="exn" placeholder="Ej. Leg Press" value="' + esc(e.name) + '"></div>' +
    '<div class="fld"><label>Tipo</label><div class="tabbar">' +
    '<button type="button" class="' + (e.type === 'cardio' ? '' : 'on') + '" onclick="setExType(\'fuerza\')">🏋️ Fuerza</button>' +
    '<button type="button" class="' + (e.type === 'cardio' ? 'on' : '') + '" onclick="setExType(\'cardio\')">🏃 Cardio</button>' +
    '</div></div>' +
    '<div class="fld"><label>Descripción corta</label><input id="exd" placeholder="Ej. Cuádriceps" value="' + esc(e.note || '') + '"></div>' +
    '<div class="fld" id="exMuscles">' + musclesChipsHTML() + '</div>' +
    (e.type === 'cardio' ? '' : '<div class="row2">' +
    '<div class="fld"><label>Series</label><input id="exs" type="number" inputmode="numeric" min="1" max="10" value="' + e.sets + '"></div>' +
    '<div class="fld"><label>Reps</label><input id="exr" type="number" inputmode="numeric" min="1" max="50" value="' + e.reps + '"></div>' +
    '<div class="fld"><label>Descanso s</label><input id="exp" type="number" inputmode="numeric" min="0" max="300" step="15" value="' + e.rest + '"></div>' +
    '</div>') +
    '<div class="fld"><label>Imagen</label><div id="exPrev">' + exPreviewHTML() + '</div></div>' +
    '<div class="fld" id="exImgTab">' + imgTabHTML() + '</div>' +
    (UI.exGlobal ? '' : linkOldHTML()) +
    '<button class="btn btn-p" onclick="commitEx(UI.exIdx)">' + (isNew ? 'Añadir' : 'Guardar') + '</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>';
}

/* Músculo principal (uno) + secundarios (varios) como chips, en vez del
   select de antes — y un campo para escribir uno que no esté en la lista:
   en cuanto se usa una vez, ya sale como chip para la próxima. */
/* un chip de músculo que no esté en la lista fija MUSCLES es "tuyo" — se
   puede borrar de verdad (para arreglar una errata), no solo deseleccionar.
   Los 10 de fábrica no llevan ese botón, no tiene sentido borrarlos. */
function muscleChipHTML(m, onClass, onclickFn) {
  var isCustom = MUSCLES.indexOf(m) < 0;
  return '<span style="position:relative;display:inline-block">' +
    '<button type="button" class="chip' + onClass + '" onclick="' + onclickFn + '(\'' + esc(m) + '\')">' + esc(m) + '</button>' +
    (isCustom ? '<button type="button" title="Borrar este músculo de la lista" style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;line-height:14px;font-size:9px;padding:0;background:var(--bad);color:#fff;border-radius:50%;border:2px solid var(--surface)" onclick="event.stopPropagation();purgeCustomMuscleConfirm(\'' + esc(m) + '\')">✕</button>' : '') +
    '</span>';
}
function musclesChipsHTML() {
  var e = UI.exDraft, all = allMuscles();
  /* si acabas de escribir uno nuevo, aún no está guardado en ningún sitio
     — allMuscles() no puede verlo todavía. Se añade aquí para que el chip
     aparezca al instante, no solo después de guardar el ejercicio. */
  if (e.muscle && all.indexOf(e.muscle) < 0) all = all.concat([e.muscle]);
  (e.muscles2 || []).forEach(function (m) { if (all.indexOf(m) < 0) all.push(m); });
  var h = '<label>Músculo principal</label><div class="chips">' +
    all.map(function (m) { return muscleChipHTML(m, e.muscle === m ? ' on' : '', 'toggleMusclePrimary'); }).join('') + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<input id="exNewPrimary" placeholder="Añadir músculo principal…" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px">' +
    '<button type="button" class="btn btn-n sm" style="width:auto;padding:9px 16px" onclick="addCustomMuscle(\'primary\')">Añadir</button></div>' +
    '<label style="margin-top:14px">Músculos secundarios</label><div class="chips">' +
    all.filter(function (m) { return m !== e.muscle; }).map(function (m) { return muscleChipHTML(m, (e.muscles2 || []).indexOf(m) >= 0 ? ' on2' : '', 'toggleMuscleSecondary'); }).join('') + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<input id="exNewSecondary" placeholder="Añadir músculo secundario…" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px">' +
    '<button type="button" class="btn btn-n sm" style="width:auto;padding:9px 16px" onclick="addCustomMuscle(\'secondary\')">Añadir</button></div>';
  return h;
}
function toggleMusclePrimary(m) {
  syncDraftFields();
  var activando = UI.exDraft.muscle !== m;
  UI.exDraft.muscle = activando ? m : '';
  if (activando) UI.exDraft.muscles2 = (UI.exDraft.muscles2 || []).filter(function (x) { return x !== m; });
  refreshMuscles();
}
function toggleMuscleSecondary(m) {
  syncDraftFields();
  var arr = UI.exDraft.muscles2 || (UI.exDraft.muscles2 = []);
  var i = arr.indexOf(m);
  if (i >= 0) arr.splice(i, 1); else arr.push(m);
  refreshMuscles();
}
function addCustomMuscle(which) {
  syncDraftFields();
  var inputId = which === 'secondary' ? 'exNewSecondary' : 'exNewPrimary';
  var v = (document.getElementById(inputId).value || '').trim();
  if (!v) return;
  if (which === 'secondary') {
    var arr = UI.exDraft.muscles2 || (UI.exDraft.muscles2 = []);
    if (arr.indexOf(v) < 0 && v !== UI.exDraft.muscle) arr.push(v);
  } else {
    UI.exDraft.muscle = v;
    UI.exDraft.muscles2 = (UI.exDraft.muscles2 || []).filter(function (x) { return x !== v; });
  }
  refreshMuscles();
}
/* borra un músculo escrito por error: lo quita del ejercicio que se está
   editando Y de cualquier otro que ya lo tuviera guardado — si no, seguiría
   saliendo en la lista para siempre aunque lo deseleccionaras aquí. */
function purgeCustomMuscleConfirm(m) {
  if (!confirm('¿Borrar "' + m + '" de la lista de músculos? Se quita de todos los ejercicios que lo tengan.')) return;
  purgeCustomMuscle(m);
  refreshMuscles();
  toast('Músculo borrado', 'ok');
}
function purgeCustomMuscle(m) {
  if (UI.exDraft.muscle === m) UI.exDraft.muscle = '';
  UI.exDraft.muscles2 = (UI.exDraft.muscles2 || []).filter(function (x) { return x !== m; });
  DB.routines.forEach(function (r) {
    (r.ex || []).forEach(function (ex) {
      if (ex.muscle === m) ex.muscle = '';
      if (ex.muscles2 && ex.muscles2.indexOf(m) >= 0) ex.muscles2 = ex.muscles2.filter(function (x) { return x !== m; });
    });
  });
  DB.exercises.forEach(function (ex) {
    if (ex.muscle === m) ex.muscle = '';
    if (ex.muscles2 && ex.muscles2.indexOf(m) >= 0) ex.muscles2 = ex.muscles2.filter(function (x) { return x !== m; });
  });
  commit();
}
function refreshMuscles() {
  var el = document.getElementById('exMuscles');
  if (el) el.innerHTML = musclesChipsHTML();
}

/* Fuente de la imagen como pestañas: antes se veían las cuatro formas de
   elegir imagen a la vez (foto/catálogo/icono/reusar), todas desplegadas —
   liaba. Ahora solo se ve una a la vez. */
function imgTabHTML() {
  var tab = UI.exImgTab || 'icono';
  var tabs = [['foto', '📷 Foto'], ['catalogo', '🗂 Catálogo'], ['icono', '⭐ Icono']];
  if (!UI.exGlobal) tabs.push(['reusar', '↔ Reusar']);
  var h = '<div class="tabbar">' + tabs.map(function (t) {
    return '<button type="button" class="' + (tab === t[0] ? 'on' : '') + '" onclick="setImgTab(\'' + t[0] + '\')">' + t[1] + '</button>';
  }).join('') + '</div>' +
    '<div id="exImgTabBody">' + imgTabBodyHTML() + '</div>';
  return h;
}
function imgTabBodyHTML() {
  var tab = UI.exImgTab || 'icono';
  if (tab === 'foto') {
    return '<input type="file" id="exfile" accept="image/*" style="display:none" onchange="onPhotoPick(this)">' +
      '<button class="btn btn-g sm" style="margin-bottom:10px" onclick="document.getElementById(\'exfile\').click()">Subir foto desde el móvil</button>' +
      '<div class="picker scroll" id="exPick">' + exPickerHTML() + '</div>';
  }
  if (tab === 'catalogo') return '<div class="picker scroll" id="exCatalog">' + exCatalogHTML() + '</div>';
  if (tab === 'reusar') return '<div id="exReuseWrap">' + reuseHTML() + '</div>';
  return '<div class="picker scroll" id="exIcons">' + exIconsHTML() + '</div>' +
    '<div class="fld" style="margin-top:10px"><label>O un emoji del teclado</label>' +
    '<input class="emoji-in" id="exEmoji" placeholder="Toca y usa 🙂 del teclado" maxlength="8" ' +
    'value="' + (isEmoji(UI.exDraft.icon) ? esc(UI.exDraft.icon) : '') + '" oninput="onExEmoji(this.value)"></div>';
}
function setImgTab(tab) {
  syncDraftFields();
  UI.exImgTab = tab;
  var wrap = document.getElementById('exImgTab');
  if (wrap) wrap.innerHTML = imgTabHTML();
}

/* Si esta rutina tiene sesiones antiguas con nombres que ya no coinciden con
   ningún ejercicio actual, se ofrece vincularlas EXPLÍCITAMENTE — nunca por
   adivinanza — para que el historial y "mismo peso" las reconozcan. */
function linkOldHTML() {
  if (!UI.editRoutine || !UI.editRoutine.id) return '';
  var huerfanos = orphanExNames(UI.editRoutine.id);
  if (!huerfanos.length) return '';
  var sel = UI.exDraft.linkOld || '';
  return '<div class="fld"><label>¿Es este ejercicio uno que ya tenías guardado con otro nombre?</label>' +
    '<select class="sel" id="exLinkOld" onchange="UI.exDraft.linkOld=this.value">' +
    '<option value="">— No, es distinto —</option>' +
    huerfanos.map(function (o) {
      return '<option value="' + esc(o.name) + '"' + (sel === o.name ? ' selected' : '') + '>' +
        esc(o.name) + ' (' + o.count + ' registro' + (o.count === 1 ? '' : 's') + ' antiguos)</option>';
    }).join('') + '</select>' +
    '<div class="hint" style="text-align:left;padding-top:5px">Si eliges uno, tu historial anterior se sumará a este ejercicio: mismo peso, misma gráfica de progreso.</div></div>';
}

/* Reutilizar un ejercicio de otra rutina: comparten identidad (id), así que
   el historial y las comparativas funcionan aunque el nombre visible sea
   distinto en cada rutina. Es la vía correcta para "la misma máquina en dos
   rutinas" — más fiable que confiar en que el texto coincida al escribirlo. */
function reuseHTML() {
  var rid = UI.editRoutine && UI.editRoutine.id;
  var otros = allExercisesFlat(rid);
  if (!otros.length) return '<div class="hint" style="text-align:left;padding:2px 0">Aún no tienes ejercicios en otras rutinas.</div>';
  var sel = UI.exDraft.reuseId || '';
  var h = '<select class="sel" id="exReuse" onchange="onReuseEx(this.value)" style="margin-bottom:0">' +
    '<option value="">— Es distinto, crear nuevo —</option>';
  var porRutina = {};
  otros.forEach(function (o) { (porRutina[o.routineName] = porRutina[o.routineName] || []).push(o); });
  Object.keys(porRutina).forEach(function (rn) {
    h += '<optgroup label="' + esc(rn) + '">';
    porRutina[rn].forEach(function (o) {
      h += '<option value="' + o.id + '"' + (sel === o.id ? ' selected' : '') + '>' + esc(o.name) + '</option>';
    });
    h += '</optgroup>';
  });
  h += '</select>';
  if (sel) {
    var src = otros.find(function (o) { return o.id === sel; });
    if (src) h += '<div class="hint" style="text-align:left;padding-top:6px">Compartirá historial con "' + esc(src.name) + '" de ' + esc(src.routineName) + '. Puedes darle otro nombre o foto aquí sin romper el vínculo.</div>';
  }
  return h;
}
function onReuseEx(exId) {
  syncDraftFields();
  if (!exId) { UI.exDraft.reuseId = ''; refreshExSheet(); return; }
  var src = allExercisesFlat(UI.editRoutine && UI.editRoutine.id).find(function (o) { return o.id === exId; });
  if (!src) return;
  UI.exDraft.reuseId = exId;
  UI.exDraft.id = src.id;                 /* adopta el id: aquí está la magia */
  UI.exDraft.name = src.name;
  UI.exDraft.img = src.img;
  UI.exDraft.icon = src.icon;
  UI.exDraft.muscle = src.muscle || '';
  UI.exDraft.muscles2 = (src.muscles2 || []).slice();
  refreshExSheet();
  refreshMuscles();
  var nameEl = document.getElementById('exn'); if (nameEl) nameEl.value = UI.exDraft.name;
}

function exPreviewHTML() {
  var e = UI.exDraft, src = imgSrc(e.img);
  if (src) {
    return '<div style="display:flex;align-items:center;gap:12px">' +
      '<img src="' + src + '" style="width:74px;height:74px;border-radius:13px;object-fit:cover;background:#fff;border:1px solid var(--line)">' +
      '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">' +
      (e.img.slice(0, 2) === 'p:' ? 'Foto tuya' : 'Del catálogo') + '</div>' +
      '<div style="font-size:11.5px;color:var(--dim2);margin-top:2px">Toca abajo para cambiarla</div></div>' +
      '<button class="mini" onclick="clearExImg()" title="Quitar imagen">✕</button></div>';
  }
  return '<div style="display:flex;align-items:center;gap:12px">' +
    '<div class="ex-emo" style="width:74px;height:74px;border-radius:13px">' + iconSVG(e.icon || 'dumbbell', 32) + '</div>' +
    '<div style="flex:1;font-size:12px;color:var(--dim2);line-height:1.5">Sin foto — se usará el icono</div></div>';
}

/* fotos SUBIDAS por ti que están de verdad en uso ahora mismo en algún
   ejercicio — sirve para no mostrar en el selector las que ya no usa nadie
   (se van solas) y para saber cuáles se pueden borrar sin más. */
function livePhotosInUse() {
  var used = {};
  DB.routines.forEach(function (r) { (r.ex || []).forEach(function (e) { if (e.img && e.img.slice(0, 2) === 'p:') used[e.img.slice(2)] = 1; }); });
  DB.exercises.forEach(function (e) { if (e.img && e.img.slice(0, 2) === 'p:') used[e.img.slice(2)] = 1; });
  return used;
}
function exPickerHTML() {
  var e = UI.exDraft, h = '', used = livePhotosInUse();
  livePhotos().forEach(function (p) {
    var k = 'p:' + p.id;
    if (!used[p.id] && e.img !== k) return;   /* huérfana: no se muestra, ya no acumula */
    h += '<div style="position:relative">' +
      '<button class="pk' + (e.img === k ? ' on' : '') + '" style="width:100%" onclick="pickImg(\'' + k + '\')"><img src="' + p.data + '" alt=""></button>' +
      '<button class="mini" title="Borrar esta foto" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;font-size:10px;background:var(--bad);color:#fff;border-radius:50%;border:2px solid var(--surface)" onclick="event.stopPropagation();deletePhotoConfirm(\'' + p.id + '\')">✕</button>' +
      '</div>';
  });
  if (!h) h = '<div class="hint" style="text-align:left;padding:2px 0">Aún no has subido ninguna foto.</div>';
  return h;
}
function deletePhotoConfirm(id) {
  if (!confirm('¿Borrar esta foto para siempre? Los ejercicios que la usan se quedarán con el icono en su lugar.')) return;
  deletePhoto(id);
  refreshExSheet();
  toast('Foto borrada', 'ok');
}
function deletePhoto(id) {
  var p = PH.find(function (x) { return x.id === id; });
  if (p) { p.del = true; p.data = ''; p.mt = now(); }
  var key = 'p:' + id;
  DB.routines.forEach(function (r) { (r.ex || []).forEach(function (e) { if (e.img === key) e.img = ''; }); });
  DB.exercises.forEach(function (e) { if (e.img === key) e.img = ''; });
  if (UI.exDraft && UI.exDraft.img === key) UI.exDraft.img = '';
  commit();
}
/* cuántas fotos tuyas hay guardadas que ningún ejercicio usa ahora mismo */
function unusedPhotosCount() {
  var used = livePhotosInUse();
  return livePhotos().filter(function (p) { return !used[p.id]; }).length;
}
function deleteUnusedPhotosConfirm() {
  var n = unusedPhotosCount();
  if (!n) return;
  if (!confirm('¿Borrar ' + n + ' foto' + (n === 1 ? '' : 's') + ' que no usa ningún ejercicio? No se puede deshacer.')) return;
  var used = livePhotosInUse();
  PH.forEach(function (p) { if (!p.del && !used[p.id]) { p.del = true; p.data = ''; p.mt = now(); } });
  commit(); render();
  toast('✓ ' + n + ' foto' + (n === 1 ? '' : 's') + ' borrada' + (n === 1 ? '' : 's'), 'ok');
}
function exCatalogHTML() {
  var e = UI.exDraft, h = '';
  Object.keys(IMGLIB).forEach(function (k) {
    h += '<button class="pk' + (e.img === k ? ' on' : '') + '" onclick="pickImg(\'' + k + '\')"><img src="' + imgSrc(k) + '" alt=""></button>';
  });
  return h;
}

function exIconsHTML() {
  var e = UI.exDraft;
  return ICONKEYS.map(function (k) {
    return '<button class="pk' + (!e.img && e.icon === k ? ' on' : '') + '" onclick="pickEmo(\'' + k + '\')">' + iconSVG(k, 25) + '</button>';
  }).join('');
}

function refreshExSheet() {
  var a = document.getElementById('exPrev'); if (a) a.innerHTML = exPreviewHTML();
  var b = document.getElementById('exImgTabBody'); if (b) b.innerHTML = imgTabBodyHTML();
}

function pickImg(k) { syncDraftFields(); UI.exDraft.img = k; refreshExSheet(); }
function pickEmo(k) { syncDraftFields(); UI.exDraft.icon = k; UI.exDraft.img = ''; refreshExSheet(); }
function clearExImg() { syncDraftFields(); UI.exDraft.img = ''; refreshExSheet(); }

function syncDraftFields() {
  var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
  var v;
  if ((v = g('exn')) !== null) UI.exDraft.name = v;
  if ((v = g('exd')) !== null) UI.exDraft.note = v;
  if ((v = g('exs')) !== null) UI.exDraft.sets = Math.min(10, Math.max(1, parseInt(v) || 3));
  if ((v = g('exr')) !== null) UI.exDraft.reps = Math.min(50, Math.max(1, parseInt(v) || 12));
  if ((v = g('exp')) !== null) UI.exDraft.rest = Math.min(300, Math.max(0, parseInt(v) || 60));
  if ((v = g('exmuscle')) !== null) UI.exDraft.muscle = v;
}

/* Sube una foto: se reduce a 360 px y se guarda como JPEG.
   Sin comprimir, tres fotos del móvil no cabrían en la sincronización. */
function onPhotoPick(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('Eso no es una imagen', 'bad'); return; }
  syncDraftFields();
  toast('Procesando foto…');
  var rd = new FileReader();
  rd.onerror = function () { toast('No se pudo leer el archivo', 'bad'); };
  rd.onload = function () {
    var im = new Image();
    im.onerror = function () { toast('Imagen no válida', 'bad'); };
    im.onload = function () {
      try {
        var MAX = 360;
        var sc = Math.min(1, MAX / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc)), hh = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, hh);
        cx.drawImage(im, 0, 0, w, hh);
        var data = cv.toDataURL('image/jpeg', 0.62);
        if (data.length > 260000) data = cv.toDataURL('image/jpeg', 0.45);
        var pid = uid('p');
        PH.push({ id: pid, data: data, mt: now() });
        if (!savePhotos()) { PH.pop(); return; }
        pushPhotos();
        UI.exDraft.img = 'p:' + pid;
        refreshExSheet();
        toast('✓ Foto añadida (' + Math.round(data.length / 1024) + ' KB)', 'ok');
      } catch (err) { toast('No se pudo procesar la foto', 'bad'); }
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

/* Guarda el ejercicio en el catálogo (DB.exercises) y reparte su identidad
   a cualquier copia que ya exista en alguna rutina — así CUALQUIER ejercicio
   que crees o edites, esté donde esté, queda disponible para reutilizar y
   se mantiene igual en todos los sitios donde se usa. */
function upsertCatalog(e) {
  var c = DB.exercises.find(function (x) { return x.id === e.id; });
  var fields = { name: e.name, img: e.img, icon: e.icon, muscle: e.muscle || '', muscles2: e.muscles2 || [], type: e.type || 'fuerza' };
  if (c) { Object.assign(c, fields); c.mt = now(); c.del = false; }
  else DB.exercises.push(Object.assign({ id: e.id, mt: now() }, fields));
  propagateExerciseIdentity(e.id, fields);
}

function commitEx(i) {
  syncDraftFields();
  var e = UI.exDraft;
  if (!e.name.trim()) { toast('Ponle nombre al ejercicio', 'bad'); return; }
  delete e.reuseId;   /* solo era una marca de la interfaz, no se guarda */
  if (UI.exGlobal) {
    upsertCatalog(e);
    commit(); UI.exGlobal = false; closeSheet(); render();
    toast('✓ Ejercicio guardado', 'ok');
    return;
  }
  if (i < 0) UI.editRoutine.ex.push(e); else UI.editRoutine.ex[i] = e;
  upsertCatalog(e);
  if (UI.exDraft.linkOld) {
    var n = linkOldName(UI.editRoutine.id, UI.exDraft.linkOld, e.id);
    if (n) toast('Vinculados ' + n + ' registro' + (n === 1 ? '' : 's') + ' antiguos', 'ok');
  }
  commit(); closeSheet(); render();
}
function saveRoutine() {
  var r = UI.editRoutine;
  if (!r.name.trim()) { toast('Ponle nombre a la rutina', 'bad'); return; }
  if (!r.ex.length) { toast('Añade al menos un ejercicio', 'bad'); return; }
  r.mt = now();
  var i = DB.routines.findIndex(function (x) { return x.id === r.id; });
  if (i >= 0) {
    linkRenamedExercises(DB.routines[i], r);
    DB.routines[i] = r;
  } else {
    DB.routines.push(r);
  }
  commit(); UI.editRoutine = null; UI.tab = 'train'; render(); scrollTop();
  toast('✓ Rutina guardada', 'ok');
}

/* Cuando renombras un ejercicio existente, todas las sesiones que lo tenían
   guardado con el nombre ANTIGUO pasan a compartir identidad (exid) con el
   nombre nuevo. Es seguro porque en este momento sabemos con certeza cuál
   era el nombre viejo de cada id — no es una suposición por posición.
   A partir de aquí, historial, progreso y "mismo peso" quedan vinculados. */
function linkRenamedExercises(oldRoutine, newRoutine) {
  var cambios = 0;
  (newRoutine.ex || []).forEach(function (ex) {
    var antes = (oldRoutine.ex || []).find(function (o) { return o.id === ex.id; });
    if (!antes || antes.name === ex.name) return;
    DB.sessions.forEach(function (s) {
      if (s.rid !== newRoutine.id) return;
      (s.entries || []).forEach(function (en) {
        if (!en.exid && en.name === antes.name) { en.exid = ex.id; cambios++; }
      });
    });
  });
  if (cambios) toast('Vinculado el historial de ' + cambios + ' registro' + (cambios === 1 ? '' : 's') + ' antiguos', 'ok');
}
function delRoutine() {
  if (!confirm('¿Eliminar la rutina "' + UI.editRoutine.name + '"?\n\nLas sesiones ya guardadas se conservan.')) return;
  var r = DB.routines.find(function (x) { return x.id === UI.editRoutine.id; });
  if (r) { r.del = true; r.mt = now(); }
  commit(); UI.editRoutine = null; UI.tab = 'train'; render(); toast('Rutina eliminada');
}

/* ============================================================
   Pantalla: EJERCICIOS
   Catálogo de todo lo que usas: reutilizable al montar una rutina nueva,
   editable en un sitio y visible dónde se usa cada uno.
   ============================================================ */
/* nombre sin acentos/mayúsculas/espacios sueltos — solo para AGRUPAR
   posibles duplicados a la vista; no toca el matching de historial en
   ningún otro sitio (ese sigue siendo exacto, a propósito). */
function normName(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
}
function exUsage(exId) {
  return liveRoutines().filter(function (r) { return (r.ex || []).some(function (x) { return x.id === exId; }); }).map(function (r) { return r.name; });
}
function exDuplicateGroups() {
  var byName = {};
  allExercisesFlat().forEach(function (o) { (byName[normName(o.name)] = byName[normName(o.name)] || []).push(o); });
  return Object.keys(byName).map(function (k) { return byName[k]; }).filter(function (g) { return g.length > 1; });
}

function viewExercises() {
  var all = allExercisesFlat().sort(function (a, b) { return a.name.localeCompare(b.name, 'es'); });
  var h = '<div class="topbar"><div><h1>Ejercicios</h1><div class="sub">' + all.length + ' en total</div></div>' +
    '<button class="icon-btn" onclick="editExGlobal(null)" title="Nuevo ejercicio">＋</button></div><div class="wrap">';

  var musclesUsed = {};
  all.forEach(function (o) { if (o.muscle) musclesUsed[o.muscle] = 1; (o.muscles2 || []).forEach(function (m) { musclesUsed[m] = 1; }); });
  var muscleList = Object.keys(musclesUsed).sort(function (a, b) { return a.localeCompare(b, 'es'); });
  var filt = UI.exFilter || '';
  if (muscleList.length) {
    h += '<div class="chips" style="margin-bottom:12px">' +
      '<button type="button" class="chip' + (filt ? '' : ' on') + '" onclick="setExFilter(\'\')">Todos</button>' +
      muscleList.map(function (m) { return '<button type="button" class="chip' + (filt === m ? ' on' : '') + '" onclick="setExFilter(\'' + esc(m) + '\')">' + esc(m) + '</button>'; }).join('') +
      '</div>';
  }
  if (filt) all = all.filter(function (o) { return o.muscle === filt || (o.muscles2 || []).indexOf(filt) >= 0; });

  var dups = exDuplicateGroups();
  if (dups.length) {
    h += '<div class="banner"><b>Posibles duplicados</b>: mismo nombre, ejercicios distintos — su historial no se compara entre sí hasta que los fusiones.</div>';
    dups.forEach(function (g) {
      h += '<div class="card" style="padding:12px;margin-bottom:10px">' +
        '<div style="font-weight:700;margin-bottom:8px">' + esc(g[0].name) + '</div>';
      g.forEach(function (o) {
        h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
          '<span style="flex:1;font-size:12.5px;color:var(--dim)">' + esc(o.routineName) + '</span>' +
          (o.id === g[0].id ? '' : '<button class="btn btn-g sm" style="width:auto;padding:6px 12px" onclick="mergeExercisesConfirm(\'' + g[0].id + '\',\'' + o.id + '\')">Fusionar con "' + esc(g[0].routineName) + '"</button>') +
          '</div>';
      });
      h += '</div>';
    });
  }

  if (!all.length) h += filt
    ? '<div class="empty"><span class="big">🏋️</span>Ningún ejercicio de "' + esc(filt) + '".</div>'
    : '<div class="empty"><span class="big">🏋️</span>Aún no tienes ejercicios.<br>Se añaden solos al crearlos en una rutina, o pulsa ＋.</div>';

  all.forEach(function (o) {
    var uso = exUsage(o.id);
    h += '<div class="ex"><div class="ex-h" style="cursor:pointer" onclick="exDetailSheet(\'' + o.id + '\')">' + exThumb(o, true) +
      '<div class="ex-b"><div class="ex-n">' + esc(o.name) + '</div>' +
      '<div class="ex-m">' + (o.muscle ? esc(o.muscle) + ' · ' : '') + (uso.length ? 'Usado en ' + uso.map(esc).join(', ') : 'Sin asignar a ninguna rutina') + '</div></div>' +
      '<button class="mini" title="Editar" onclick="event.stopPropagation();editExGlobal(\'' + o.id + '\')">✏️</button>' +
      (uso.length
        ? '<button class="mini" title="En uso — quítalo desde su rutina" disabled style="opacity:.3">✕</button>'
        : '<button class="mini" title="Eliminar" onclick="event.stopPropagation();deleteExerciseGlobal(\'' + o.id + '\')">✕</button>') +
      '</div></div>';
  });

  h += '</div>';
  return h;
}

function setExFilter(m) { UI.exFilter = m; render(); }
function mergeExercisesConfirm(keepId, dropId) {

/* ============================================================
   Pantalla: HISTORIAL
   ============================================================ */
/* mejor serie del mismo ejercicio en la sesión anterior a esta */
function prevTop(exName, s, exId) {
  var ss = liveSessions();
  for (var i = 0; i < ss.length; i++) {
    var o = ss[i];
    if (o.id === s.id) continue;
    if (o.date > s.date) continue;
    if (o.date === s.date && (o.mt || 0) >= (s.mt || 0)) continue;
    var ents = o.entries || [], e = null;
    if (exId) e = ents.find(function (x) { return x.exid === exId && entryMetric(x) > 0; });
    if (!e) e = ents.find(function (x) { return x.name === exName && entryMetric(x) > 0; });
    if (e) return entryMetric(e);
  }
  return null;
}
function deltaHTML(cur, prev) {
  if (prev == null) return '<span class="hd new">nuevo</span>';
  var d = Math.round((cur - prev) * 10) / 10;
  if (d > 0) return '<span class="hd up">+' + d + '</span>';
  if (d < 0) return '<span class="hd down">' + d + '</span>';
  return '<span class="hd same">=</span>';
}
function totalSets(s) {
  var n = 0;
  (s.entries || []).forEach(function (e) {
    (e.sets || []).forEach(function (st) { if (st.kg || st.reps) n++; });
  });
  return n;
}

function viewHist() {
  var ss = liveSessions().filter(sessionFilled);
  var h = '<div class="topbar"><div><h1>Historial</h1><div class="sub">' + ss.length + ' sesión' + (ss.length === 1 ? '' : 'es') + ' registrada' + (ss.length === 1 ? '' : 's') + '</div></div>' +
    '<button class="icon-btn" onclick="manualSession()" title="Añadir a mano">＋</button></div><div class="wrap">';
  if (!ss.length) {
    h += '<div class="empty"><span class="big">' + iconSVG('chartup', 34) + '</span>Todavía no hay sesiones.<br>Entrena y guarda la primera.</div></div>';
    return h;
  }
  h += '<div class="banner">Al lado de cada peso ves <b>cuánto has subido o bajado</b> respecto a la última vez que hiciste ese ejercicio. Toca una sesión para corregirla.</div>';

  var lastMonth = '';
  ss.forEach(function (s) {
    var mk = s.date.slice(0, 7);
    if (mk !== lastMonth) {
      lastMonth = mk;
      var p = mk.split('-');
      h += '<div class="sect">' + MES[+p[1] - 1].toUpperCase() + ' ' + p[0] + '</div>';
    }
    var col = sessColor(s);
    var filled = (s.entries || []).filter(function (e) { return entryMetric(e) > 0; });
    var mejoras = 0, bajadas = 0;
    filled.forEach(function (e) {
      var pv = prevTop(e.name, s, e.exid); if (pv == null) return;
      var cur = entryMetric(e);
      if (cur > pv) mejoras++; else if (cur < pv) bajadas++;
    });

    h += '<button class="hs" style="border-left:3px solid ' + col + '" onclick="openSession(\'' + s.id + '\')">' +
      '<div class="hs-t"><div><div class="hs-d">' + fdate(s.date) + '</div>' +
      '<div class="hs-r" style="color:' + col + '"><span style="display:flex">' + iconSVG(sessIcon(s), 14) + '</span>' + esc(sessName(s)) + '</div></div>' +
      (mejoras || bajadas
        ? '<div class="hs-badge">' + (mejoras ? '<span class="hd up">▲ ' + mejoras + '</span>' : '') +
          (bajadas ? '<span class="hd down">▼ ' + bajadas + '</span>' : '') + '</div>'
        : '') +
      '</div>';

    h += '<div class="hrows">';
    filled.forEach(function (e) {
      if (e.type === 'cardio') {
        h += '<div class="hrow"><span class="hn">' + esc(liveExName(e, s.rid)) + '</span>' +
          '<span class="hv">' + cardioSummary(e) + '</span>' +
          deltaHTML(entryMetric(e), prevTop(e.name, s, e.exid)) + '</div>';
        return;
      }
      var best = null, bestReps = '';
      (e.sets || []).forEach(function (st) {
        var k = parseFloat(st.kg);
        if (k > 0 && (best === null || k > best)) { best = k; bestReps = st.reps || ''; }
      });
      h += '<div class="hrow"><span class="hn">' + esc(liveExName(e, s.rid)) + '</span>' +
        '<span class="hv">' + best + ' kg' + (bestReps ? ' × ' + bestReps : '') + '</span>' +
        deltaHTML(best, prevTop(e.name, s, e.exid)) + '</div>';
    });
    h += '</div>';

    h += '<div class="hfoot">' + filled.length + ' ejercicios · ' + totalSets(s) + ' series · ' +
      volSession(s).toLocaleString('es-ES') + ' kg movidos en total</div>';
    h += '</button>';
  });
  h += '<div style="height:4px"></div>' +
    '<button class="btn btn-n sm" onclick="explainMetrics()">¿Qué significan estos números?</button></div>';
  return h;
}

function manualSession() {
  var rs = liveRoutines();
  if (!rs.length) { toast('Crea antes una rutina', 'bad'); return; }
  var h = '<div class="grab"></div><div class="sheet-h">Añadir sesión a mano</div>' +
    '<div class="sheet-s">Para apuntar un entrenamiento pasado</div>';
  rs.forEach(function (r) {
    h += '<button class="rt" onclick="closeSheet();startSession(\'' + r.id + '\')">' +
      '<div class="rt-ic" style="color:' + colorHex(r.color) + ';background:' + colorHex(r.color) + '1f;border-color:' + colorHex(r.color) + '4d">' + iconSVG(r.icon || 'dumbbell', 22) + '</div><div class="rt-b"><div class="rt-n">' + esc(r.name) + '</div>' +
      '<div class="rt-m">' + (r.ex || []).length + ' ejercicios</div></div><div class="rt-go">›</div></button>';
  });
  openSheet(h);
}

/* ============================================================
   Vinculador de historial en una sola pantalla.
   Renombrar un ejercicio debe mantener su seguimiento: aquí se
   emparejan los nombres antiguos con los ejercicios actuales.
   Siempre confirmado por el usuario, nunca adivinado.
   ============================================================ */
function abrirVinculador(rid) {
  var faltan = exercisesNeedingLink(rid);
  if (!faltan.length) {
    openSheet('<div class="grab"></div><div class="sheet-h">Nada que vincular</div>' +
      '<div class="sheet-s">Todos los ejercicios de esta rutina ya tienen historial propio o compartido</div>' +
      '<button class="btn btn-n" onclick="closeSheet()">Cerrar</button>');
    return;
  }
  var viejos = orphanExNames(rid);
  var otras = allExercisesFlat(rid);            /* ejercicios de las DEMÁS rutinas */
  UI.linkDraft = {};
  var h = '<div class="grab"></div><div class="sheet-h">Vincular historial</div>' +
    '<div class="sheet-s">Empareja cada ejercicio con su historial anterior — el mismo nombre de antes, o el mismo aparato en otra rutina — y el seguimiento continúa junto.</div>';

  var porRutina = {};
  otras.forEach(function (o) { (porRutina[o.routineName] = porRutina[o.routineName] || []).push(o); });

  faltan.forEach(function (ex) {
    h += '<div class="fld"><label>' + esc(ex.name) + '</label>' +
      '<select class="sel" onchange="onVinculoSel(\'' + ex.id + '\',this.value)">' +
      '<option value="">— Es nuevo, sin historial —</option>';
    if (viejos.length) {
      h += '<optgroup label="Nombre antiguo de esta rutina">' +
        viejos.map(function (o) {
          return '<option value="old:' + esc(o.name) + '">' + esc(o.name) + ' · ' + o.count + ' registro' + (o.count === 1 ? '' : 's') + '</option>';
        }).join('') + '</optgroup>';
    }
    Object.keys(porRutina).forEach(function (rn) {
      h += '<optgroup label="Mismo aparato en ' + esc(rn) + '">' +
        porRutina[rn].map(function (o) {
          return '<option value="ex:' + o.id + '">' + esc(o.name) + '</option>';
        }).join('') + '</optgroup>';
    });
    h += '</select></div>';
  });

  h += '<button class="btn btn-p" onclick="aplicarVinculos(\'' + rid + '\')">Vincular</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>';
  openSheet(h);
}
function onVinculoSel(exId, val) { UI.linkDraft[exId] = val; }

function aplicarVinculos(rid) {
  var total = 0, usadosViejo = {}, usadosEx = {};
  Object.keys(UI.linkDraft || {}).forEach(function (exId) {
    var val = UI.linkDraft[exId];
    if (!val) return;
    if (val.indexOf('old:') === 0) {
      var nombre = val.slice(4);
      if (usadosViejo[nombre]) return;        /* un nombre antiguo solo puede ir a un ejercicio */
      usadosViejo[nombre] = 1;
      total += linkOldName(rid, nombre, exId);
    } else if (val.indexOf('ex:') === 0) {
      var otroId = val.slice(3);
      if (usadosEx[otroId]) return;           /* un ejercicio de otra rutina, un único destino */
      usadosEx[otroId] = 1;
      total += adoptSharedId(rid, exId, otroId) || 1;  /* aunque sin historial propio, la identidad ya queda compartida */
    }
  });
  UI.linkDraft = {};
  closeSheet();
  if (!total) { toast('No se vinculó nada', 'bad'); return; }
  commit();
  /* si hay una sesión abierta, recargar su precarga con el historial ya vinculado */
  if (UI.tab === 'session' && UI.sess && UI.isNew) {
    var rid2 = UI.sess.rid;
    UI.dirty = false;
    startSession(rid2);
  } else {
    render();
  }
  toast('✓ Vinculados ' + total + ' registros · el historial ya continúa', 'ok');
}

</script>
<script>
/* ===== views3.js ===== */
/* ============================================================
   Gráficas SVG (sin librerías externas — funciona sin conexión)
   ============================================================ */
/* Escala con números redondos: se elige primero el PASO (1, 2, 2.5, 5, 10…)
   y de ahí salen mínimo y máximo. Dividir el máximo en tres partes daba
   etiquetas como 833 o 43. */
function niceScale(lo, hi, ticks) {
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 10; }
  if (hi === lo) {                       /* un único valor: dejarlo centrado */
    var pad = Math.abs(lo) * 0.25 || 5;
    lo -= pad; hi += pad;
  }
  if (lo > 0 && lo < (hi - lo)) lo = 0;   /* si el suelo está cerca del 0, anclarlo */
  var raw = (hi - lo) / ticks;
  var mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / mag;
  var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  var min = Math.floor(lo / step) * step;
  var max = Math.ceil(hi / step) * step;
  if (min < 0 && lo >= 0) min = 0;
  while ((max - min) / step > ticks + 0.01) max -= step;
  if (max <= min) max = min + step;
  return { min: min, max: max, step: step };
}

function fmtAxis(v, step) {
  if (Math.abs(v) >= 1000) {
    var k = v / 1000;
    return (k % 1 === 0 ? k : k.toFixed(1)) + 'k';
  }
  var dec = step < 1 ? 1 : 0;
  var t = v.toFixed(dec);
  return t.indexOf('.') >= 0 ? t.replace(/\.?0+$/, '') : t;   /* 39.0 → 39 */
}
function fmtK(n) {
  if (Math.abs(n) >= 1000) { var k = n / 1000; return (k % 1 === 0 ? k : k.toFixed(1)) + 'k'; }
  return String(Math.round(n * 10) / 10);
}

function lineChart(pts, opt) {
  opt = opt || {};
  var W = 320, H = opt.h || 132, PL = 38, PR = 8, PT = 12, PB = 20;
  if (!pts.length) return '<div class="empty" style="padding:26px 10px">Sin datos todavía</div>';

  var vals = pts.map(function (p) { return p.y; });
  var sc = niceScale(opt.zoom ? Math.min.apply(null, vals) : 0, Math.max.apply(null, vals), 3);
  var iw = W - PL - PR, ih = H - PT - PB;
  var Y = function (v) { return PT + ih - ih * ((v - sc.min) / (sc.max - sc.min || 1)); };
  var X = function (i) { return pts.length === 1 ? PL + iw / 2 : PL + iw * i / (pts.length - 1); };

  /* rejilla */
  var g = '';
  for (var v = sc.min; v <= sc.max + 1e-9; v += sc.step) {
    var y = Y(v);
    g += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '" stroke="#2e2e36" stroke-width="1"/>' +
      '<text x="' + (PL - 7) + '" y="' + (y + 3.5).toFixed(1) + '" fill="#5c5c68" font-size="9" text-anchor="end" font-weight="600">' +
      fmtAxis(v, sc.step) + '</text>';
  }

  var body = '';
  if (pts.length === 1) {
    /* un solo punto: un punto, no una línea plana inventada */
    var cx = X(0), cy = Y(pts[0].y);
    body = '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5" fill="#ff6a1f"/>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (cy - 11).toFixed(1) + '" fill="#f2f2f5" font-size="11" font-weight="700" text-anchor="middle">' +
      fmtK(pts[0].y) + (opt.unit || '') + '</text>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (H - 5) + '" fill="#5c5c68" font-size="9" text-anchor="middle" font-weight="600">' + esc(pts[0].x || '') + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px">' + g + body + '</svg>';
  }

  var d = '', a = '';
  pts.forEach(function (p, n) { d += (n ? 'L' : 'M') + X(n).toFixed(1) + ',' + Y(p.y).toFixed(1); });
  a = d + 'L' + X(pts.length - 1).toFixed(1) + ',' + (PT + ih) + 'L' + X(0).toFixed(1) + ',' + (PT + ih) + 'Z';

  var dots = pts.map(function (p, n) {
    var last = n === pts.length - 1;
    return '<circle cx="' + X(n).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (last ? 4 : 2.6) + '" fill="' +
      (last ? '#ff6a1f' : '#16161a') + '" stroke="#ff6a1f" stroke-width="1.8"/>';
  }).join('');

  var labs = '', step = Math.max(1, Math.ceil(pts.length / 5));
  pts.forEach(function (p, n) {
    if (p.x && (n % step === 0 || n === pts.length - 1)) {
      labs += '<text x="' + X(n).toFixed(1) + '" y="' + (H - 5) + '" fill="#5c5c68" font-size="9" text-anchor="middle" font-weight="600">' + esc(p.x) + '</text>';
    }
  });

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px">' +
    '<defs><linearGradient id="gr' + (opt.gid || 0) + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#ff6a1f" stop-opacity=".32"/><stop offset="100%" stop-color="#ff6a1f" stop-opacity="0"/></linearGradient></defs>' +
    g + '<path d="' + a + '" fill="url(#gr' + (opt.gid || 0) + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="#ff6a1f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labs + '</svg>';
}

/* Calendario real por meses: cada mes es un bloque de columnas-semana.
   La primera semana del mes solo tiene los días que existen — si agosto
   empieza en sábado, esa columna lleva 2 cuadros y no 7. */
function calendar(sessions) {
  var MESES_VISIBLES = 6;

  var byDay = {};
  sessions.forEach(function (s) {
    var v = volSession(s), d = byDay[s.date];
    if (!d) byDay[s.date] = { vol: v, top: v, color: sessColor(s), name: sessName(s) };
    else { d.vol += v; if (v > d.top) { d.top = v; d.color = sessColor(s); d.name = sessName(s); } }
  });
  var maxV = 1;
  Object.keys(byDay).forEach(function (k) { if (byDay[k].vol > maxV) maxV = byDay[k].vol; });

  var hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  var hoyIso = new Date(hoy.getTime() - hoy.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

  var h = '<div class="calwrap" id="calwrap">' +
    '<div class="caldow"><div>L</div><div></div><div>X</div><div></div><div>V</div><div></div><div>D</div></div>' +
    '<div class="calmonths">';

  for (var i = MESES_VISIBLES - 1; i >= 0; i--) {
    var ref = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    var y = ref.getFullYear(), m = ref.getMonth();
    var ultimo = new Date(y, m + 1, 0).getDate();

    /* agrupar los días del mes en columnas de semana (lunes arriba) */
    var semanas = [], col = null;
    for (var dia = 1; dia <= ultimo; dia++) {
      var dt = new Date(y, m, dia);
      var dow = (dt.getDay() + 6) % 7;          /* 0 = lunes */
      if (col === null || dow === 0) { col = [null, null, null, null, null, null, null]; semanas.push(col); }
      col[dow] = new Date(dt.getTime() - dt.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    }

    h += '<div class="calm' + (i === 0 ? ' cur' : '') + '"><div class="calweeks">';
    semanas.forEach(function (sem) {
      h += '<div class="calcol">';
      sem.forEach(function (iso) {
        if (!iso) { h += '<div class="calc void"></div>'; return; }
        var rec = byDay[iso];
        var esHoy = iso === hoyIso;
        if (!rec) {
          h += '<div class="calc' + (esHoy ? ' today' : '') + '"' +
            (iso > hoyIso ? ' style="opacity:.35"' : '') + ' title="' + iso + '"></div>';
        } else {
          var r = rec.vol / maxV;
          var alpha = r < .4 ? '80' : r < .75 ? 'bf' : 'ff';
          h += '<div class="calc on' + (esHoy ? ' today' : '') + '" style="background:' + rec.color + alpha +
            '" title="' + iso + ' · ' + esc(rec.name) + ' · ' + rec.vol + ' kg"></div>';
        }
      });
      h += '</div>';
    });
    h += '</div><div class="calmlbl">' + MES[m] + (m === 0 || i === MESES_VISIBLES - 1 ? " '" + String(y).slice(2) : '') + '</div></div>';
  }

  h += '</div></div>';
  return h;
}

/* el calendario nace desplazado a la derecha: lo interesante es lo reciente */
function scrollCalEnd() {
  var c = document.getElementById('calwrap');
  if (c) c.scrollLeft = c.scrollWidth;
}

function heatLegend() {
  var used = {};
  liveSessions().filter(sessionFilled).forEach(function (s) { used[sessName(s)] = sessColor(s); });
  var names = Object.keys(used);
  if (!names.length) return '';
  return '<div class="legend">' + names.map(function (n) {
    return '<span class="lg"><i style="background:' + used[n] + '"></i>' + esc(n) + '</span>';
  }).join('') + '</div>';
}

/* ============================================================
   Pantalla: PROGRESO
   ============================================================ */
function viewProg() {
  var ss = liveSessions().filter(sessionFilled);
  var asc = ss.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  var h = '<div class="topbar"><div><h1>Progreso</h1><div class="sub">' +
    (asc.length ? 'Desde el ' + fdate(asc[0].date) : 'Aún sin datos') + '</div></div>' +
    '<span class="syncpill' + (fbStatus() === 'live' ? ' live' : '') + '"><span class="dot"></span>' +
    (fbStatus() === 'live' ? 'Sync' : fbStatus() === 'wait' ? '…' : 'Local') + '</span></div><div class="wrap">';

  if (asc.length < 1) {
    h += '<div class="empty"><span class="big">' + iconSVG('chartup', 34) + '</span>Las gráficas aparecen<br>en cuanto guardes tu primera sesión.</div></div>';
    return h;
  }

  /* --- métricas --- */
  var totalVol = asc.reduce(function (a, s) { return a + volSession(s); }, 0);
  var thisMonth = asc.filter(function (s) { return s.date.slice(0, 7) === todayISO().slice(0, 7); }).length;

  /* racha: semanas consecutivas (hacia atrás) con al menos una sesión */
  var weekKey = function (iso) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  };
  var weeks = {}; asc.forEach(function (s) { weeks[weekKey(s.date)] = 1; });
  var streak = 0, cur = new Date();
  for (var k = 0; k < 260; k++) {
    var iso = new Date(cur.getTime() - cur.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    if (weeks[weekKey(iso)]) streak++;
    else if (k > 6) break;
    cur.setDate(cur.getDate() - 7);
  }

  h += '<div class="stats">' +
    '<div class="stat acc"><div class="v">' + asc.length + '</div><div class="k">Sesiones</div></div>' +
    '<div class="stat"><div class="v">' + thisMonth + '</div><div class="k">Este mes</div></div>' +
    '<div class="stat"><div class="v">' + streak + '</div><div class="k">Semanas<br>seguidas</div></div>' +
    '</div>' +
    '<div class="stats" style="grid-template-columns:1fr 1fr;margin-top:9px">' +
    '<div class="stat"><div class="v">' + fmtK(totalVol) + ' kg</div><div class="k">Peso total<br>movido</div></div>' +
    '<div class="stat"><div class="v">' + fmtK(Math.round(totalVol / asc.length)) + ' kg</div><div class="k">Media por<br>sesión</div></div>' +
    '</div>' +
    '<button class="btn btn-n sm" style="margin-top:11px" onclick="explainMetrics()">¿Qué significan estos números?</button>';

  /* --- días entrenados --- */
  h += '<div class="sect">Constancia</div><div class="chartbox">' +
    '<h3>Días que has ido</h3><div class="cs">Cada columna es una semana · el color indica la rutina · desliza para ver meses anteriores</div>' +
    calendar(asc) + heatLegend() + '</div>';

  /* --- volumen por sesión --- */
  var volPts = asc.slice(-14).map(function (s) {
    return { x: s.date.slice(8) + '/' + s.date.slice(5, 7), y: volSession(s) };
  });
  h += '<div class="sect">Volumen</div><div class="chartbox">' +
    '<h3>Peso total movido por sesión</h3><div class="cs">Suma de peso × repeticiones de todas las series · ' +
    (volPts.length === 1 ? 'tu única sesión hasta ahora' : 'últimas ' + volPts.length + ' sesiones') + '</div>' +
    lineChart(volPts, { gid: 1, unit: ' kg' }) + '</div>';

  /* --- progresión por ejercicio --- */
  /* agrupar por identidad (exid si existe, si no por nombre) y mostrar
     siempre el nombre ACTUAL de cada ejercicio, para que renombrar no
     desdoble el historial en dos entradas distintas */
  var grupos = {};
  asc.forEach(function (s) {
    (s.entries || []).forEach(function (e) {
      if (topSet(e) <= 0) return;
      var k = exKey(e);
      if (!grupos[k]) grupos[k] = { label: liveExName(e, s.rid), count: 0 };
      grupos[k].count++;
    });
  });
  var list = Object.keys(grupos).sort(function (a, b) { return grupos[b].count - grupos[a].count; });
  if (list.length) {
    if (!UI.progEx || list.indexOf(UI.progEx) < 0) UI.progEx = list[0];
    var pts = [];
    asc.forEach(function (s) {
      var e = (s.entries || []).find(function (x) { return exKey(x) === UI.progEx; });
      if (e && topSet(e) > 0) pts.push({ x: s.date.slice(8) + '/' + s.date.slice(5, 7), y: topSet(e) });
    });
    var delta = pts.length > 1 ? pts[pts.length - 1].y - pts[0].y : 0;
    h += '<div class="sect">Por ejercicio</div>' +
      '<select class="sel" onchange="UI.progEx=this.value;render()">' +
      list.map(function (k) { return '<option value="' + esc(k) + '"' + (k === UI.progEx ? ' selected' : '') + '>' + esc(grupos[k].label) + ' (' + grupos[k].count + ')</option>'; }).join('') +
      '</select>' +
      '<div class="chartbox"><h3>Peso máximo por sesión</h3>' +
      '<div class="cs">' + (pts.length > 1
        ? (delta > 0 ? '▲ +' + Math.round(delta * 10) / 10 + ' kg desde la primera vez' : delta < 0 ? '▼ ' + Math.round(delta * 10) / 10 + ' kg respecto a la primera vez' : 'Mismo peso que la primera vez')
        : 'Cuando lo repitas verás aquí la evolución') + '</div>' +
      lineChart(pts, { gid: 2, zoom: true, unit: ' kg' }) + '</div>';
  }

  h += '<div style="height:6px"></div></div>';
  return h;
}


/* ============================================================
   Explicación de las métricas — el usuario no tiene por qué
   saber qué es el "volumen"
   ============================================================ */
function explainMetrics() {
  var ss = liveSessions().filter(sessionFilled);
  var ej = ss.length ? volSession(ss[0]) : 0;
  openSheet('<div class="grab"></div><div class="sheet-h">Qué significa cada número</div>' +
    '<div class="sheet-s">Explicado en corto</div>' +
    exp('Sesiones', 'Cuántas veces has entrenado y guardado la sesión desde que empezaste.') +
    exp('Este mes', 'Sesiones guardadas dentro del mes en curso. Se reinicia el día 1.') +
    exp('Semanas seguidas', 'Semanas consecutivas en las que has ido al menos una vez. Si te saltas una semana entera, vuelve a cero. Mide constancia, no intensidad.') +
    exp('Peso total movido', 'Suma de <b>peso × repeticiones</b> de todas las series.<br><br>Ejemplo: 3 series de 12 repeticiones con 40 kg son 40 × 12 × 3 = <b>1.440 kg</b>.<br><br>No es el peso que levantas de una vez: es el trabajo acumulado. Sirve para comparar sesiones entre sí' + (ej ? ' (tu última salió ' + ej.toLocaleString('es-ES') + ' kg)' : '') + '. Si sube con el tiempo, estás progresando aunque el peso por serie parezca el mismo.') +
    exp('Media por sesión', 'El peso total movido dividido entre el número de sesiones. Te dice si tus sesiones típicas están siendo más o menos exigentes.') +
    exp('▲ y ▼ del historial', 'Comparan la mejor serie de ese ejercicio con la última vez que lo hiciste. <b>+3</b> significa que has subido 3 kg respecto a la sesión anterior. <b>=</b> es que has repetido peso, que también está bien.') +
    '<button class="btn btn-n" style="margin-top:6px" onclick="closeSheet()">Entendido</button>');
}
function exp(t, d) {
  return '<div style="margin-bottom:17px">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:5px;color:var(--acc)">' + t + '</div>' +
    '<div style="font-size:13px;color:var(--dim);line-height:1.6">' + d + '</div></div>';
}

</script>
<script>
/* ===== views4.js ===== */
/* ============================================================
   Pantalla: AJUSTES (sincronización, datos)
   ============================================================ */
function viewSet() {
  var st = fbStatus();
  var h = '<div class="topbar"><div><h1>Ajustes</h1><div class="sub">Sincronización y datos</div></div></div><div class="wrap">';

  h += '<div class="card" style="padding:12px 15px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">' +

    '<span class="mono" style="font-size:13px;font-weight:800;color:var(--acc)">' + esc(window.__BUILD || '?') + '</span></div>';

  h += '<div class="sect">Sala compartida</div>';

  if (CFG.room) {
    h += '<div class="card" style="padding:15px;margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px">' +
      '<div style="font-size:14px;font-weight:700">Estado</div>' +
      '<span class="syncpill' + (st === 'live' ? ' live' : '') + '"><span class="dot"></span>' +
      (st === 'live' ? 'Conectado' : 'Conectando…') + '</span></div>' +

      '<div style="height:8px"></div><button class="btn btn-n sm" onclick="askNewRoom()">Crear una sala nueva</button>' +

    livePhotos().length + ' fotos propias (' + Math.round(phBytes() / 1024) + ' KB).</div>' +
