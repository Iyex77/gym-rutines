function randomRoom() {
  var al = 'abcdefghjkmnpqrstuvwxyz23456789', r = '';
  for (var i = 0; i < 16; i++) r += al[Math.floor(Math.random() * al.length)];
  return 'sala-' + r.slice(0, 4) + '-' + r.slice(4, 10) + '-' + r.slice(10);
}

function askNewRoom() {
  var code = randomRoom();
  openSheet('<div class="grab"></div><div class="sheet-h">Crear una sala nueva</div>' +
    '<div class="sheet-s">Guarda este código: lo necesitas en el otro dispositivo</div>' +
    '<div class="room"><div class="cap">Código generado</div><div class="code">' + code + '</div></div>' +
    '<div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:16px">' +
    'Lo que tienes ahora en este dispositivo se subirá a la sala nueva.' +
    (CFG.room ? ' <b style="color:var(--warn)">Dejarás la sala actual</b>, y lo que haya solo allí no se traerá.' : '') +
    '</div>' +
    '<button class="btn btn-p" onclick="doJoin(\'' + code + '\')">Usar esta sala</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="askNewRoom()">Generar otro código</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>');
}

function askJoin() {
  openSheet('<div class="grab"></div><div class="sheet-h">Unirme a una sala</div>' +
    '<div class="sheet-s">Escribe el código del otro dispositivo</div>' +
    '<div class="fld"><label>Código de sala</label>' +
    '<input id="joinCode" placeholder="sala-xxxx-xxxxxx-xxxxxx" autocapitalize="off" autocorrect="off" spellcheck="false" value=""></div>' +
    '<div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:16px">' +
    'Tus datos actuales se fusionarán con los de esa sala. No se borra nada: si una rutina existe en los dos sitios, gana la modificada más recientemente.</div>' +
    '<button class="btn btn-p" onclick="doJoin(document.getElementById(\'joinCode\').value)">Entrar</button>' +
    '<div style="height:9px"></div><button class="btn btn-n sm" onclick="closeSheet()">Cancelar</button>');
}

function doJoin(code) {
  code = String(code || '').trim().toLowerCase().replace(/\s+/g, '');
  if (code.length < 10) { toast('El código necesita 10 caracteres o más', 'bad'); return; }
  CFG.room = code;
  if (!CFG.fbcfg) CFG.fbcfg = DEFAULT_FBCFG;
  saveCfg();
  closeSheet();
  toast('Conectando…');
  fbConnect().then(function (ok) {
    render();
    if (ok) toast('Sala activa', 'ok');
  });
}

function copyRoom() {
  var t = CFG.room;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { toast('Código copiado', 'ok'); },
    function () { prompt('Copia este código:', t); });
  else prompt('Copia este código:', t);
}
function clearSync() {
  if (!confirm('Los datos se quedan en este dispositivo y dejan de compartirse.\n\n¿Continuar?')) return;
  fbDisconnect(); CFG.room = ''; saveCfg(); render(); toast('Desconectado');
}

function exportData() {
  var blob = new Blob([JSON.stringify({ app: 'gym', v: 1, exported: new Date().toISOString(), data: DB }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gym-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('Copia descargada', 'ok');
}
function importData(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var j = JSON.parse(rd.result);
      var d = j.data || j;
      if (!d.routines && !d.sessions) throw new Error('formato');
      if (!confirm('Se fusionará con lo que ya tienes (gana lo más reciente). ¿Continuar?')) return;
      mergeRemote(d); commit(); render(); toast('✓ Copia restaurada', 'ok');
    } catch (e) { toast('Archivo no válido', 'bad'); }
    inp.value = '';
  };
  rd.readAsText(f);
}
function resetAll() {
  if (!confirm('Se borrarán TODAS las rutinas y sesiones de este dispositivo.\n\n¿Seguro?')) return;
  if (!confirm('Última confirmación. Esto no se puede deshacer.')) return;
  DB = { routines: defaultRoutines(), sessions: [], exercises: [] };
  commit(); render(); toast('Todo reiniciado');
}

/* ============================================================
   Hojas modales / lightbox
   ============================================================ */
function openSheet(html) {
  document.getElementById('sheetC').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  document.documentElement.classList.add('sheet-open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  document.documentElement.classList.remove('sheet-open');
}

/* ============================================================
   Render + navegación
   ============================================================ */
var TABS = [
  { k: 'train', ic: 'M7 7v10M4 9.2v5.6M17 7v10M20 9.2v5.6M7 12h10', l: 'Entrenar' },
  { k: 'prog', ic: 'M4 19.5V10M10 19.5V4.5M16 19.5v-6M21.5 19.5h-19', l: 'Progreso' },
  { k: 'hist', ic: 'M5 3.5h14v17l-7-3.5-7 3.5zM9 8h6M9 11.5h6', l: 'Historial' },
  { k: 'exlib', ic: 'M3 10v4M6 7.5v9M18 7.5v9M21 10v4M6 12h12', l: 'Ejercicios' },
  { k: 'set', ic: 'M12 8.6a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8zM12 2.5v3M12 18.5v3M4.2 7l2.6 1.5M17.2 15.5l2.6 1.5M4.2 17l2.6-1.5M17.2 8.5l2.6-1.5', l: 'Ajustes' }
];

function render() {
  var body;
  switch (UI.tab) {
    case 'session': body = viewSession(); break;
    case 'redit': body = viewREdit(); break;
    case 'prog': body = viewProg(); break;
    case 'hist': body = viewHist(); break;
    case 'exlib': body = viewExercises(); break;
    case 'set': body = viewSet(); break;
    default: body = viewTrain();
  }
  document.getElementById('app').innerHTML = '<div class="screen on">' + body + '</div>';
  renderNav();
  /* candado de scroll de fondo: si la hoja no está abierta, nunca debe
     quedar bloqueado. Se corrige aquí, en el único sitio por el que pasa
     cualquier acción, en vez de perseguir cada camino que cierra una hoja. */
  document.documentElement.classList.toggle('sheet-open', document.getElementById('sheet').classList.contains('on'));
  if (UI.tab === 'prog' && typeof scrollCalEnd === 'function') setTimeout(scrollCalEnd, 0);
}
function renderNav() {
  var hide = (UI.tab === 'session' || UI.tab === 'redit');
  var old = document.querySelector('nav'); if (old) old.remove();
  if (hide) return;
  var n = document.createElement('nav');
  n.innerHTML = TABS.map(function (t) {
    return '<button class="' + (UI.tab === t.k ? 'on' : '') + '" onclick="go(\'' + t.k + '\')">' +
      '<span class="ic"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + t.ic + '"/></svg></span>' + t.l + '</button>';
  }).join('');
  document.body.appendChild(n);
}
function go(k) { UI.tab = k; render(); scrollTop(); }
function busyEditing() {
  if (UI.tab === 'session' || UI.tab === 'redit') return true;
  if (document.getElementById('sheet').classList.contains('on')) return true;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return false;
}
function renderSyncPill() {
  if (busyEditing()) return;
  if (UI.tab === 'prog' || UI.tab === 'set') { try { render(); } catch (e) { } }
}

/* arranque */
loadLocal();
render();
if (CFG.fbcfg && CFG.room) fbConnect(true);

window.addEventListener('beforeunload', function (e) {
  if (UI.dirty) { e.preventDefault(); e.returnValue = ''; }
});
/* al volver a la app, refrescar por si el otro dispositivo cambió algo */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && CFG.fbcfg && CFG.room && !FB.ready) fbConnect(true);
});
